services:
  app:
    build: .
    container_name: tranle_task_app
    restart: unless-stopped
    ports:
      - "${PORT:-3500}:3500"
    volumes:
      - ./data/uploads:/app/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3500
      - DATABASE_URL=${DATABASE_URL:-mysql://${MYSQL_USER:-tranle}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-tranletask}}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_ENCRYPTION_KEY=${MAIL_ENCRYPTION_KEY}
      - APP_BASE_URL=${APP_BASE_URL}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      # Xem .env.production.example. Để rỗng => giữ hành vi cũ (1 hop).
      - TRUST_PROXY_CIDRS=${TRUST_PROXY_CIDRS:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: tranle_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tranletask}
      - MYSQL_USER=${MYSQL_USER:-tranle}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Asia/Ho_Chi_Minh
    ports:
      # Bind loopback only: the app reaches MySQL over the compose network
      # (mysql:3306), so publishing on 0.0.0.0 only exposed the database to
      # every host on the LAN — with the root account usable from outside.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailserver:
    image: analogic/poste.io
    container_name: tranle_mailserver
    hostname: mail.tranlecorp.com.vn
    restart: always
    ports:
      # 25/465/587/110/143/993/995 phải mở toàn mạng — đây là dịch vụ mail
      # công cộng. Riêng 8080 là giao diện quản trị Postfix, chỉ Nginx trên
      # chính máy này proxy tới (nginx.conf: proxy_pass 127.0.0.1:8080), nên
      # bind loopback để không ai trong LAN mở được.
      - "25:25"
      - "127.0.0.1:8080:80"
      - "4443:443"  # Cổng SSL dự phòng
      - "110:110"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - HTTPS=OFF   # Tắt HTTPS nội bộ vì Nginx đã đảm nhận mã hóa SSL (giúp tránh vòng lặp chuyển hướng)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mail-server-config/mail-data:/data

