server {
    listen 80;
    server_name mail.tranlecorp.com.vn mail.tranlecorp.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ bằng $remote_addr, không dùng $proxy_add_x_forwarded_for.
        # Biến "add" giữ lại giá trị client tự gửi trong header, nên client vẫn
        # chọn được IP của mình và mọi rate limiter/chặn theo IP phía sau trở nên
        # vô nghĩa. Xem .env.production.example phần TRUST_PROXY_*.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Websocket cho Webmail
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
